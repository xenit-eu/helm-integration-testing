apiVersion: apps/v1
kind: Deployment
metadata:
  name: tinyproxy
  namespace: kube-system
  labels:
    helm-integration-testing.contentgrid.com/app: tinyproxy
spec:
  selector:
    matchLabels:
      helm-integration-testing.contentgrid.com/app: tinyproxy
  template:
    metadata:
      labels:
        helm-integration-testing.contentgrid.com/app: tinyproxy
    spec:
      # Some hosts (e.g. Ubuntu 26.04) ship an AppArmor profile that attaches to /usr/bin/tinyproxy,
      # which also applies to the (unconfined) pods in k3s.
      # That profile does not allow tinyproxy to receive signals from the container runtime,
      # so SIGTERM is ignored and the pod is only killed after the termination grace period.
      terminationGracePeriodSeconds: 1
      containers:
        - name: tinyproxy
          image: kalaksi/tinyproxy:1.7@sha256:5a65354cbb5f9c0fdcc8de3d3af8dd1c5ea072b3a1f52e5961a9a5cce6eba227
          ports:
            - containerPort: 8888
              name: http
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: tinyproxy
  namespace: kube-system
  labels:
    helm-integration-testing.contentgrid.com/app: tinyproxy
spec:
  selector:
    helm-integration-testing.contentgrid.com/app: tinyproxy
  type: NodePort
  ports:
    - nodePort: 30100
      targetPort: http
      port: 8888
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tinyproxy
  namespace: kube-system
  labels:
    helm-integration-testing.contentgrid.com/app: tinyproxy
spec:
  podSelector:
    matchLabels:
      helm-integration-testing.contentgrid.com/app: tinyproxy
  egress:
    - to:
        # Anything inside the cluster: cilium does not match cluster-internal
        # endpoints on ipBlock CIDRs, so they need their own selectors
        - namespaceSelector: {}
  ingress:
    - {} # Allow anything to connect to the proxy
