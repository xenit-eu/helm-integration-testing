apiVersion: apps/v1
kind: Deployment
metadata:
  name: tinyproxy
  namespace: kube-system
  labels:
    helm-integration-testing.contentgrid.com/app: tinyproxy
spec:
  selector:
    matchLabels:
      helm-integration-testing.contentgrid.com/app: tinyproxy
  template:
    metadata:
      labels:
        helm-integration-testing.contentgrid.com/app: tinyproxy
    spec:
      containers:
        - name: tinyproxy
          image: monokal/tinyproxy:latest@sha256:2c1b6f187fe18a993ec6e88cdb12c8f1d28d7416bd73492289aa5f74f687c672
          # The image entrypoint script is bypassed:
          # - Some hosts (e.g. Ubuntu 26.04) ship an AppArmor profile that attaches to /usr/bin/tinyproxy,
          #   which also applies to the (unconfined) pods in k3s. It denies tinyproxy creating its shared memory in /tmp,
          #   so tinyproxy fails to start. Running a copy of the binary from a different path avoids the profile attachment.
          #   (A symlink does not work, AppArmor attaches based on the resolved path)
          # - The entrypoint script keeps running (tailing the log) when tinyproxy fails to start,
          #   running tinyproxy in the foreground makes the container fail instead.
          command:
            - /bin/sh
            - -c
            - |
              cp /usr/bin/tinyproxy /usr/local/bin/tinyproxy
              # Allow all clients to use the proxy
              sed -i -e 's/^Allow /#Allow /' /etc/tinyproxy/tinyproxy.conf
              exec /usr/local/bin/tinyproxy -d
          ports:
            - containerPort: 8888
              name: http
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: tinyproxy
  namespace: kube-system
  labels:
    helm-integration-testing.contentgrid.com/app: tinyproxy
spec:
  selector:
    helm-integration-testing.contentgrid.com/app: tinyproxy
  type: NodePort
  ports:
    - nodePort: 30100
      targetPort: http
      port: 8888
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tinyproxy
  namespace: kube-system
  labels:
    helm-integration-testing.contentgrid.com/app: tinyproxy
spec:
  podSelector:
    matchLabels:
      helm-integration-testing.contentgrid.com/app: tinyproxy
  egress:
    - to:
        # Anything inside the cluster: cilium does not match cluster-internal
        # endpoints on ipBlock CIDRs, so they need their own selectors
        - namespaceSelector: {}
  ingress:
    - {} # Allow anything to connect to the proxy
