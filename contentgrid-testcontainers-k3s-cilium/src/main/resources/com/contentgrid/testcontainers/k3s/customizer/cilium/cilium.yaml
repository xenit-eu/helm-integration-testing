apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: cilium
  namespace: kube-system
spec:
  repo: https://helm.cilium.io/
  chart: cilium
  version: 1.14.6
  bootstrap: true
  targetNamespace: kube-system
  valuesContent: |-
    operator:
      replicas: 1
    ipam:
      operator:
        # The chart default (10.0.0.0/8) overlaps with the DNS resolver of the host on some networks
        # (e.g. 10.0.0.2 on AWS-hosted GitHub runners), which breaks DNS resolution on the node once Cilium is running.
        # Use the k3s default cluster CIDR instead: https://docs.k3s.io/cli/server#networking
        clusterPoolIPv4PodCIDRList: ["10.42.0.0/16"]
---
# coredns cilium-network-policy
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: coredns
  namespace: kube-system
spec:
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: kube-system
      k8s:k8s-app: kube-dns
  ingress:
    - fromEntities:
        - cluster
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
  egress:
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    - toEntities:
        - kube-apiserver
---
# traefik cilium-network-policy
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  namespace: kube-system
  name: traefik
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: traefik
  ingress:
    - fromEntities:
        - world
        - cluster
  egress:
    - toEntities:
        - cluster
---
# helm-install-traefik cilium-network-policy
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  namespace: kube-system
  name: helm-install-traefik
spec:
  endpointSelector:
    matchLabels:
      batch.kubernetes.io/job-name: helm-install-traefik
  egress:
    - toEntities:
        - kube-apiserver
---
# helm-install-traefik-crd cilium-network-policy
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  namespace: kube-system
  name: helm-install-traefik-crd
spec:
  endpointSelector:
    matchLabels:
      batch.kubernetes.io/job-name: helm-install-traefik-crd
  egress:
    - toEntities:
        - kube-apiserver
---
# local-path provisioner cilium-network-policy
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  namespace: kube-system
  name: local-path-provisioner
spec:
  endpointSelector:
    matchLabels:
      app: local-path-provisioner
  egress:
    - toEntities:
        - kube-apiserver
---